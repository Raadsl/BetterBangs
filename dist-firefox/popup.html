<!DOCTYPE html>
<html>
<head>
  <title>All Bangs</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <nav>
    <a href="#allbangs">All Bangs</a>
    <a href="#bangshistory">Bangs History</a>
    <a href="#settings">Settings</a>
  </nav>
  <div class="content" id="allbangs">
    <h2>All Bangs</h2>
    <input type="text" id="searchInput" placeholder="Search bangs...">
    <ul id="bangsList"></ul>
  </div>
  <div class="content" id="bangshistory" style="display: none;">
    <h2>Bangs History</h2>
    <input type="text" id="historySearchInput" placeholder="Search history...">
    <ul id="historyList"></ul>
  </div>
  <div class="content" id="settings" style="display: none;">
    <h2>Settings</h2>
    <div class="setting-section">
      <h3>History</h3>
      <div class="setting-item">
        <label for="optInHistory">Enable History Collection</label>
        <label class="switch">
          <input type="checkbox" id="optInHistory">
          <span class="slider"></span>
        </label>
      </div>
      <button id="deleteHistoryButton" class="delete-button">Delete History</button>
    </div>
    <div class="setting-section">
      <h3>Bangs</h3>
      <div class="setting-item">
        <label for="firstResultEnabled" title="Like Google's I'm Feeling Lucky feature">Enable the <strong>!</strong> Bang to open the first search result</label>
        <label class="switch">
          <input type="checkbox" id="firstResultEnabled">
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-item">
        <label for="useWhitelist">Use Whitelist Mode</label>
        <label class="switch">
          <input type="checkbox" id="useWhitelist">
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-item">
        <label for="enableBlacklist">Enable Blacklist</label>
        <label class="switch">
          <input type="checkbox" id="enableBlacklist">
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-item">
        <h3>Blacklist</h3>
        <input list="bangsDatalist" type="text" id="blacklistInput" placeholder="Enter bang to add to blacklist...">
        <button id="addToBlacklistButton" class="action-button">Add to Blacklist</button>
        <ul id="blacklist"></ul>
      </div>
      <div class="setting-item">
        <h3>Whitelist</h3>
        <input list="bangsDatalist" type="text" id="whitelistInput" placeholder="Enter bang to add to whitelist...">
        <button id="addToWhitelistButton" class="action-button">Add to Whitelist</button>
        <ul id="whitelist"></ul>
      </div>
    </div>
    <p id="lastUpdated" class="last-updated-info"></p>

    <datalist id="bangsDatalist"></datalist>
  </div>
  <script src="popup.js"></script>
</body>
</html>
